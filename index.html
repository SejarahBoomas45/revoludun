<!DOCTYPE html>

<head>

<title>Stasiun Mesin Waktu</title>
<style>

:root{--bg:#f4f1ff;--card:#fff;--ink:#1f1b3a;--mut:#6b6788;--pri:#6c4df6;--pri2:#ede9ff;--ok:#18a058;--ok2:#e4f6ec;--bad:#e0383e;--bad2:#fde8e9;--warn:#b7791f;--warn2:#fff4d6;--line:#dcd7f5;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

:root[data-theme="dark"]{--bg:#15122b;--card:#1f1b3d;--ink:#eeeaff;--mut:#a29dc4;--pri:#9a85ff;--pri2:#2c2657;--ok:#3ddc84;--ok2:#12301f;--bad:#ff6b70;--bad2:#3a1a20;--warn:#f5c04a;--warn2:#3a3014;--line:#363063}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#app{max-width:760px;margin:0 auto;padding:14px 14px 40px}
h1,h2,h3{line-height:1.25;margin:.2em 0 .4em}
h1{font-size:1.8rem}h2{font-size:1.3rem}h3{font-size:1.05rem}
.mut{color:var(--mut);font-size:.9rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin:12px 0}
.hud{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:space-between;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:8px 12px;position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.hud span{font-weight:700;white-space:nowrap}
.btn{appearance:none;border:0;background:var(--pri);color:#fff;font:inherit;font-weight:700;padding:11px 18px;border-radius:12px;cursor:pointer;margin:4px 6px 4px 0}
.btn.ghost{background:var(--pri2);color:var(--pri)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.big{font-size:1.1rem;padding:14px 24px}
.tag{display:inline-block;font-size:.75rem;font-weight:700;padding:2px 9px;border-radius:99px;background:var(--pri2);color:var(--pri);margin-right:6px}
.bar{height:8px;background:var(--pri2);border-radius:9px;overflow:hidden;margin:8px 0}
.bar i{display:block;height:100%;background:var(--pri);transition:width .4s}
.lv{display:flex;gap:12px;align-items:center;cursor:pointer}
.lv.lock{opacity:.5;cursor:not-allowed}
.lv .ic{font-size:2rem;width:52px;height:52px;display:grid;place-items:center;background:var(--pri2);border-radius:14px;flex:none}
.lv .t{flex:1;min-width:0}
.stars{letter-spacing:2px}
.opt{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;font:inherit;color:inherit;background:var(--card);border:2px solid var(--line);border-radius:12px;padding:10px 12px;margin:8px 0;cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--pri)}
.opt b{flex:none;width:26px;height:26px;border-radius:8px;background:var(--pri2);color:var(--pri);display:grid;place-items:center;font-size:.85rem}
.opt.sel{border-color:var(--pri);background:var(--pri2)}
.opt.ok{border-color:var(--ok);background:var(--ok2)}
.opt.bad{border-color:var(--bad);background:var(--bad2)}
.opt.gone{display:none}
.chain{display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.chain em{font-style:normal;background:var(--pri2);color:var(--ink);border-radius:8px;padding:2px 8px;font-size:.85rem}
.chain u{text-decoration:none;color:var(--pri);font-weight:700}
.fb{border-radius:14px;padding:12px 14px;margin:12px 0}
.fb.ok{background:var(--ok2);border:1px solid var(--ok)}
.fb.bad{background:var(--bad2);border:1px solid var(--bad)}
.tip{background:var(--warn2);border:1px solid var(--warn);border-radius:12px;padding:10px 14px;margin-top:10px}
.tip ol,.rec ol,.rec ul{margin:.3em 0 .5em;padding-left:1.3em}
.para{margin:.6em 0}
.para sup{color:var(--pri);font-weight:700;margin-right:4px}
.pop{animation:pop .5s}
@keyframes pop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.12)}100%{transform:scale(1);opacity:1}}
.big-emoji{font-size:3rem;text-align:center}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.row{display:flex;align-items:center;gap:8px;margin:6px 0}
.row .bar{flex:1;margin:0}
.rec h3{color:var(--pri)}
details summary{cursor:pointer;font-weight:700}

.chip{display:block;width:100%;text-align:left;font:inherit;color:inherit;background:var(--card);border:2px solid var(--line);border-radius:12px;padding:9px 12px;margin:6px 0;cursor:pointer}
.chip.sel{border-color:var(--pri);background:var(--pri2)}.chip.ok{border-color:var(--ok);background:var(--ok2)}.chip.bad{border-color:var(--bad);background:var(--bad2)}
.ans{margin:8px 0;padding-left:1.5em}.ans li{margin:4px 0}
.src{border-left:4px solid var(--pri);background:var(--pri2);padding:8px 12px;border-radius:8px;margin:0 0 10px}
.stmt{border:1px solid var(--line);border-radius:12px;padding:8px 12px;margin:8px 0}
.pill{font:inherit;color:inherit;background:var(--card);border:2px solid var(--line);border-radius:99px;padding:6px 14px;margin:4px 8px 0 0;cursor:pointer;font-weight:700}
.pill.sel{border-color:var(--pri);background:var(--pri2)}.pill.ok{border-color:var(--ok);background:var(--ok2)}.pill.bad{border-color:var(--bad);background:var(--bad2)}
.lv .ic{overflow:hidden;padding:0}.em{width:100%;height:100%;object-fit:cover;border-radius:50%;display:block}
.emb{float:right;width:150px;height:150px;border-radius:50%;margin:0 0 8px 14px;shape-outside:circle()}
.col4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;max-width:360px;margin:0 auto 10px}
.col4 .em{aspect-ratio:1}.emc{width:130px;height:130px;border-radius:50%;margin:0 auto;display:block}
.more{margin:8px 0;padding:8px 12px;border-radius:10px;background:var(--pri2)}
.tl{padding-left:1.1em}.tl li{margin:4px 0}
details{margin:6px 0}

.vidbox{margin:14px 0;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--pri2)}
.vidplay{appearance:none;border:0;display:grid;place-items:center;width:100%;aspect-ratio:16/9;cursor:pointer;color:#fff;font:inherit;font-weight:700;background:linear-gradient(135deg,#3b2a9e,#6c4df6) center/cover no-repeat}
.vidplay span{background:rgba(0,0,0,.65);padding:12px 20px;border-radius:99px;font-size:1.05rem}
.vidplay:hover span{background:rgba(0,0,0,.85)}
.vidframe{position:relative;aspect-ratio:16/9;background:#000}.vidframe iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.vidbox .cap{padding:8px 12px;font-size:.9rem}.vidbox .cap a{color:var(--pri);font-weight:700;white-space:nowrap}
</style>
</head>

const ENR=[
{sum:[`<b>Renaissans</b> (bahasa Prancis: "kelahiran kembali") adalah masa kebangkitan seni, ilmu, dan sastra di Eropa. Gerakan ini bermula di Italia pada abad ke-14 dan mencapai puncaknya pada abad ke-15 dan ke-16. Para pemikirnya menggali kembali warisan Yunani dan Romawi kuno.`,
`Italia menjadi pusatnya karena kota-kota dagang seperti Florence, Venesia, dan Genoa makmur berkat perdagangan dengan Timur. Keluarga kaya, misalnya keluarga Medici di Florence, menjadi <b>mecenas</b> (pelindung) yang mendanai seniman dan ilmuwan.`,
`Cara pandang barunya disebut <b>humanisme</b>: manusia, akal, dan pengamatan alam dihargai. Orang tidak lagi hanya menerima keterangan turun-temurun. Penemuan mesin cetak oleh Johannes Gutenberg (sekitar 1450) mempercepat penyebaran buku dan gagasan.`],
link:`Ilmu astronomi, pembuatan peta, kompas, dan teknik perkapalan yang berkembang pada masa ini membuat pelayaran samudra lebih mungkin. Itulah jembatan menuju kedatangan bangsa Eropa di Nusantara.`,
tl:[['Abad ke-14','Humanisme mulai tumbuh di kota-kota Italia'],['1436','Kubah Katedral Florence rancangan Brunelleschi rampung'],['± 1450','Gutenberg mengembangkan mesin cetak'],['1453','Konstantinopel jatuh ke Turki Usmani'],['1501–1504','Michelangelo memahat patung David'],['± 1503','Leonardo da Vinci mulai melukis Mona Lisa']],
terms:[['Humanisme','Paham yang menempatkan manusia dan potensinya sebagai pusat perhatian'],['Rasionalisme','Pandangan bahwa kebenaran dicari dengan akal dan bukti'],['Mecenas','Pelindung atau penyandang dana seniman dan ilmuwan'],['Leonardo da Vinci','Seniman sekaligus ilmuwan; Mona Lisa dan Manusia Vitruvian'],['Michelangelo','Pemahat dan pelukis; patung David']],
fact:`Pada emblem stasiun ini terlihat patung David, Kubah Florence, lukisan Mona Lisa, dan sketsa Manusia Vitruvian. Keempatnya sering dipakai sebagai lambang semangat Renaissans.`,
more:[`Brunelleschi membangun kubah Florence tanpa rangka kayu penyangga raksasa. Prestasi teknik ini menjadi simbol keberanian Renaissans.`,`Venesia dan Genoa lama menjadi perantara rempah ke Eropa. Tradisi dagang Italia juga melahirkan pelaut seperti Christopher Columbus dari Genoa.`,`Percetakan membuat buku jauh lebih murah. Gagasan humanis, peta, dan buku pelayaran pun menyebar ke banyak negeri dalam waktu singkat.`]},
{sum:[`Pada abad ke-15 dan ke-16, bangsa Eropa, terutama Portugis dan Spanyol, memulai pelayaran samudra. Pendorongnya dikenal sebagai <b>3G</b>: <i>Gold</i> (kekayaan), <i>Gospel</i> (penyebaran agama), dan <i>Glory</i> (kejayaan negara).`,
`Rempah seperti lada, cengkih, pala, dan kayu manis sangat berharga di Eropa untuk bumbu, pengawet makanan, dan obat. Rempah itu tiba lewat jalur yang dikuasai pedagang Timur Tengah dan Italia sehingga mahal. Jatuhnya Konstantinopel (1453) dianggap memperkuat dorongan mencari jalur baru.`,
`Pelayaran jauh ditopang kompas, astrolab, peta yang lebih baik, dan kapal layar seperti karavel. Portugis menempuh jalur timur mengelilingi Afrika, sedangkan Spanyol berlayar ke barat.`],
link:`Nusantara bukan wilayah kosong. Malaka, Ternate, Tidore, Banten, dan Gowa sudah menjadi pusat perdagangan internasional. Portugis merebut Malaka (1511) dan tiba di Maluku (1512). Belanda datang ke Banten (1596), lalu VOC dibentuk (1602) dengan hak monopoli.`,
tl:[['1453','Konstantinopel jatuh ke Turki Usmani'],['1494','Perjanjian Tordesillas membagi wilayah pelayaran Spanyol dan Portugis'],['1498','Vasco da Gama tiba di India'],['1511','Portugis merebut Malaka'],['1512','Portugis tiba di Maluku'],['1596','Cornelis de Houtman tiba di Banten'],['1602','VOC berdiri']],
terms:[['3G','Gold, Gospel, Glory: motif penjelajahan samudra'],['Monopoli','Penguasaan perdagangan suatu barang oleh satu pihak'],['Oktroi','Hak istimewa VOC: monopoli dagang, memiliki tentara, membuat perjanjian, mencetak uang'],['Pelayaran Hongi','Pelayaran armada VOC untuk mengawasi dan menebang tanaman rempah di luar wilayah yang ditentukan'],['Kongsi dagang','Perusahaan dagang gabungan, mis. VOC']],
fact:`Perjanjian Tordesillas (1494) membagi dunia untuk dijelajahi antara Spanyol dan Portugis. Emblem stasiun ini menampilkan peta jalur pelayaran, kapal layar, kompas, serta lada, kayu manis, dan bunga lawang sebagai komoditas incaran.`,
more:[`Tordesillas 1494 menunjukkan bahwa dua kerajaan Eropa membagi dunia tanpa bertanya kepada penghuninya. Itu gambaran awal cara pandang kolonial.`,`Rempah dipakai sebagai bumbu, pengawet, parfum, dan obat. Langka di Eropa tetapi melimpah di Maluku, nilainya berlipat di pasar Eropa.`,`Dengan oktroi, VOC bertindak seperti negara kecil. Pelayaran Hongi dipakai agar pasokan rempah tetap terbatas dan harga tetap tinggi.`]},
{sum:[`<b>Revolusi Industri</b> bermula di Inggris pada paruh kedua abad ke-18. Pekerjaan tangan digantikan mesin, dan produksi pindah dari rumah ke pabrik. Penemuan pentingnya antara lain mesin uap yang disempurnakan James Watt (paten 1769), mesin pemintal dan tenun, lalu lokomotif uap dan kereta api.`,
`Inggris unggul karena memiliki modal dari perdagangan dan jajahan, batu bara dan besi yang melimpah, pasar yang luas, serta semangat penemuan. Produksi massal membuat barang melimpah, tetapi juga melahirkan urbanisasi, kelas buruh, kelas pemilik modal (kapitalis), dan kondisi kerja yang keras.`,
`Pabrik membutuhkan bahan mentah murah dan pasar yang luas. Kebutuhan ini mendorong <b>imperialisme modern</b> pada abad ke-19.`],
link:`Di Hindia Belanda, kebutuhan itu tampak pada Tanam Paksa (Cultuurstelsel, 1830) di bawah Gubernur Jenderal Johannes van den Bosch. Setelah UU Agraria 1870, perkebunan swasta berkembang. Kritik terhadap penderitaan rakyat akhirnya melahirkan Politik Etis (1901).`,
tl:[['1769','James Watt mematenkan penyempurnaan mesin uap'],['1825','Kereta api uap umum pertama di Inggris (Stockton–Darlington)'],['1830','Tanam Paksa di Hindia Belanda'],['1867','Jalur kereta api pertama di Hindia Belanda (Semarang–Tanggung)'],['1869','Terusan Suez dibuka'],['1870','UU Agraria membuka perkebunan swasta'],['1901','Politik Etis diumumkan']],
terms:[['Mekanisasi','Penggantian tenaga manusia dan hewan dengan mesin'],['Kapitalisme','Sistem ekonomi berbasis modal pribadi dan pencarian keuntungan'],['Urbanisasi','Perpindahan penduduk ke kota'],['Bahan mentah','Bahan dasar untuk diolah pabrik, mis. kapas, tebu, nila'],['Imperialisme modern','Perluasan kekuasaan abad ke-19 demi bahan mentah, pasar, dan modal']],
fact:`Terusan Suez (1869) dan kapal uap memperpendek perjalanan Eropa–Hindia Belanda. Jalur kereta api awal di Jawa dibangun terutama untuk mengangkut hasil perkebunan, bukan semata melayani rakyat.`,
more:[`Mesin uap memungkinkan pabrik berdiri dekat kota dan pelabuhan. Kereta api dan kapal uap lalu mempercepat pengangkutan bahan mentah dan hasil produksi.`,`Gula, nila, dan kopi dari Jawa diolah atau dijual di pasar Eropa. Keuntungan terbesar mengalir ke negara induk, sedangkan petani menanggung kerja berat.`,`Kolonialisme kuno mengandalkan perdagangan dan monopoli. Pada imperialisme modern, penguasa menanam modal langsung, misalnya perkebunan swasta setelah UU Agraria 1870.`]},
{sum:[`<b>Revolusi Prancis</b> meletus pada 1789. Penyebabnya krisis keuangan negara, ketimpangan masyarakat (rohaniwan, bangsawan, dan rakyat biasa sebagai Golongan Ketiga yang menanggung pajak berat), serta gagasan <b>Pencerahan</b> dari Montesquieu, Voltaire, dan Rousseau.`,
`Peristiwa simbolisnya adalah penyerbuan penjara Bastille pada 14 Juli 1789. Lalu lahir Deklarasi Hak Manusia dan Warga Negara dan semboyan <i>Liberté, Égalité, Fraternité</i> (kebebasan, persamaan, persaudaraan). Monarki jatuh dan Prancis menjadi republik pada 1792.`,
`Perang antarnegara Eropa merembet sampai ke Belanda. Prancis menguasai Belanda (1795) dan Belanda menjadi Republik Batavia. Louis Bonaparte, adik Napoleon, menjadi raja Belanda (1806) dan mengutus Daendels ke Jawa (1808).`],
link:`Daendels (1808–1811) membangun Jalan Raya Pos dan memusatkan pemerintahan. Inggris merebut Jawa pada 1811 (Kapitulasi Tuntang) dan Raffles menerapkan sewa tanah (landrent). Jawa dikembalikan kepada Belanda pada 1816. Prinsip kebebasan tidak berlaku bagi rakyat jajahan, tetapi gagasannya kelak diserap kaum terpelajar Indonesia.`,
tl:[['14 Juli 1789','Penyerbuan Bastille'],['1792','Prancis menjadi republik'],['1795','Prancis menguasai Belanda; Republik Batavia'],['1806','Louis Bonaparte menjadi raja Belanda'],['1808','Daendels tiba di Jawa'],['1811','Inggris merebut Jawa'],['1816','Jawa dikembalikan kepada Belanda']],
terms:[['Pencerahan','Zaman yang menekankan akal, kebebasan berpikir, dan hak manusia'],['Golongan Ketiga','Rakyat biasa Prancis yang menanggung pajak'],['Liberté, Égalité, Fraternité','Semboyan Revolusi Prancis'],['Republik Batavia','Pemerintahan Belanda di bawah pengaruh Prancis (1795–1806)'],['Landrent','Sistem sewa tanah masa Raffles: petani membayar pajak atas tanah garapan']],
fact:`Setiap 14 Juli, Prancis memperingati hari nasionalnya, yang berakar pada peristiwa Bastille. Emblem stasiun ini menampilkan benteng Bastille dan bendera trikolor yang dikibarkan rakyat.`,
more:[`Napoleon tidak hanya menaklukkan Eropa. Pengaruhnya sampai ke Hindia Belanda lewat Belanda yang diperintah saudaranya, yang lalu mengutus Daendels ke Jawa.`,`Slogan itu lahir dari gagasan Pencerahan: Montesquieu dengan pemisahan kekuasaan, Rousseau dengan kedaulatan rakyat. Gagasan itu menjadi senjata moral bagi bangsa terjajah di kemudian hari.`,`Jalan Raya Pos Anyer–Panarukan (sekitar 1.000 km) dibangun dengan kerja paksa. Landrent Raffles menegaskan bahwa tanah dianggap milik pemerintah dan petani membayar sewa pajaknya.`]},
{sum:[`<b>Kolonialisme</b> adalah penguasaan atas wilayah dan rakyat bangsa lain untuk kepentingan ekonomi, politik, dan kekuasaan negara penjajah. <b>Imperialisme</b> adalah paham atau politik memperluas kekuasaan atas bangsa lain, baik dengan pendudukan langsung maupun pengaruh.`,
`Ada dua gelombang. Kolonialisme kuno (abad ke-15–18) bermotif Gold, Gospel, Glory, dengan kongsi dagang dan monopoli. Imperialisme modern (abad ke-19 sampai awal abad ke-20) bermotif kebutuhan industri: bahan mentah, pasar, dan modal, ditambah gengsi politik.`,
`Dampaknya luas: eksploitasi tenaga dan sumber daya, kemiskinan, perubahan susunan masyarakat, serta infrastruktur (jalan, rel, pelabuhan) yang dibangun untuk kepentingan penjajah. Pendidikan yang terbatas tanpa sengaja melahirkan kaum terpelajar yang menumbuhkan nasionalisme.`],
link:`Rantainya: Renaissans memajukan ilmu pelayaran, penjelajahan membawa Eropa ke Nusantara, VOC membangun monopoli, Revolusi Prancis mengubah penguasa Jawa dan menyebarkan gagasan kebebasan, Revolusi Industri mendorong imperialisme modern, lalu nasionalisme Indonesia tumbuh.`,
tl:[['1511','Portugis merebut Malaka'],['1602','VOC berdiri'],['1830','Tanam Paksa'],['1870','UU Agraria'],['1901','Politik Etis'],['1908','Budi Utomo berdiri'],['1928','Sumpah Pemuda'],['1945','Proklamasi Kemerdekaan']],
terms:[['Kolonialisme','Penguasaan wilayah dan rakyat bangsa lain demi kepentingan penguasa'],['Imperialisme','Politik memperluas kekuasaan atas bangsa lain'],['Eksploitasi','Pemanfaatan tenaga dan sumber daya secara berlebihan demi keuntungan sepihak'],['Politik Etis','Kebijakan balas budi 1901: irigasi, edukasi, emigrasi'],['Nasionalisme','Kesadaran dan semangat kebangsaan']],
fact:`Kata "koloni" berasal dari bahasa Latin colonia yang berarti permukiman. Dalam sejarah modern maknanya bergeser menjadi wilayah yang dikuasai dan dieksploitasi bangsa lain. Emblem keempat stasiun ditampilkan di sini sebagai rantai sebab-akibat.`,
more:[`Dalam sejarah, kata "koloni" bergeser dari sekadar permukiman menjadi wilayah yang dikuasai dan dieksploitasi bangsa lain.`,`Dua gelombang itu tampak di Nusantara: dari monopoli VOC sampai perkebunan swasta setelah 1870.`,`Rantai ini bukan jalur lurus yang pasti, karena tiap peristiwa dipicu banyak faktor. Menyusunnya membantu kita melihat bahwa penjajahan Nusantara berkaitan dengan perubahan besar di Eropa.`,`Politik Etis (irigasi, edukasi, emigrasi) menambah jumlah kaum terpelajar. Budi Utomo (1908), Sumpah Pemuda (1928), dan Proklamasi (1945) menjadi tonggaknya.`]}
];

pilah:['Putuskan satu per satu dan tanyakan: periode atau pihak mana yang paling cocok dengan pernyataan ini?','Cari kata kunci khas tiap kategori, misalnya rempah dan agama untuk kolonialisme kuno, bahan mentah dan pasar untuk imperialisme modern.','Kerjakan dulu yang paling yakin. Sisanya biasanya mengikuti pola.']};
const RANKS=[[0,'Penumpang Baru'],[100,'Penjelajah Waktu'],[220,'Penyidik Sejarah'],[350,'Ahli Rantai Sejarah']];
const $=s=>document.querySelector(s);
const e=t=>String(t).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
let S={coins:20,xp:0,hearts:5,stars:{}};
try{Object.assign(S,JSON.parse(localStorage.getItem('msv1')||'{}'))}catch(x){}
const save=()=>{try{localStorage.setItem('msv1',JSON.stringify(S))}catch(x){}};
let R=null,view='home';
const rank=()=>RANKS.filter(r=>S.xp>=r[0]).pop()[1];
const hearts=()=>'❤️'.repeat(Math.max(0,S.hearts))+'🖤'.repeat(Math.max(0,5-S.hearts));
const hud=()=>`<div class="hud"><span>${hearts()}</span><span>🪙 ${S.coins}</span><span>⭐ ${S.xp} XP</span>${R&&R.combo>1?`<span>🔥 x${R.combo}</span>`:''}</div>`;
const go=v=>{view=v;render();window.scrollTo(0,0)};
const unlocked=i=>i===0||S.stars[i-1]>0;
function render(){$('#app').innerHTML=({home,hub,brief,play,done,over,notes})[view]()}

function home(){return `<div class="card"><div class="col4">${IMG.map(s=>`<img class="em" src="${s}" alt="">`).join('')}</div><h1 style="text-align:center">Stasiun Mesin Waktu</h1>
<p style="text-align:center" class="mut">Naiki mesin waktu dan telusuri bagaimana Renaissans, Revolusi Industri, dan Revolusi Prancis berhubungan dengan kedatangan penjajah ke Indonesia.</p>
<div class="cols"><div class="card"><h3>🚉 4 stasiun + 1 menara</h3><p class="mut">Tiap stasiun punya 3 tantangan: sebab-akibat, analisis sumber, dan klasifikasi. Menara Konsep merangkai semuanya.</p></div>
<div class="card"><h3>❤️ Nyawa</h3><p class="mut">5 nyawa. Jawaban salah mengurangi 1. Gagal atau nyawa habis, kamu mendapat rekomendasi materi untuk dibaca ulang.</p></div>
<div class="card"><h3>🪙 Koin, ⭐ XP, 🏅 Lencana</h3><p class="mut">Kumpulkan reward dan naikkan pangkatmu. Koin bisa ditukar Ramuan nyawa.</p></div>
<div class="card"><h3>📖 Pojok Baca</h3><p class="mut">Tiap stasiun punya bacaan lengkap: ringkasan, garis waktu, istilah, dan kaitan dengan Nusantara. Semua tersimpan di Buku Catatan.</p></div><div class="card"><h3>⚡ Tips Kilat dan Pengayaan</h3><p class="mut">Setelah tiap tantangan muncul pembahasan, cara cepat berpikir historis, dan pengayaan sejarah.</p></div></div>
<div style="text-align:center"><button class="btn big" data-a="hub">Masuk Stasiun</button></div></div>`}

function hub(){return hud()+`<h2>Peta Stasiun</h2><p class="mut">Pangkat: <b>${rank()}</b>. Lulus stasiun dengan paling banyak 1 jawaban salah.</p>
<div><button class="btn ghost" data-a="heal" ${S.coins<40||S.hearts>=5?'disabled':''}>🧪 Ramuan +1 nyawa (40🪙)</button><button class="btn ghost" data-a="notes">📖 Buku Catatan</button><button class="btn ghost" data-a="reset">♻️ Mulai dari nol</button></div>`+
ST.map((t,i)=>{const s=S.stars[i]||0,ok=unlocked(i);return `<div class="card lv ${ok?'':'lock'}" data-a="${ok?'start':'none'}" data-i="${i}"><div class="ic">${ok?(i<4?`<img class="em" src="${IMG[i]}" alt="">`:t.ic):'🔒'}</div><div class="t"><span class="tag">${i<4?'Stasiun '+(i+1):'Final'}</span><div><b>${t.name}</b></div><div class="mut">${s?'🏅 '+t.badge:t.era}</div></div><div class="stars">${'⭐'.repeat(s)}${'☆'.repeat(3-s)}</div></div>`}).join('')}

function initCh(){const c=ST[R.s].ch[R.i];R.pick=[];R.done=false;R.pool=null;
if(c.k==='urut'){let p=c.items.map((_,k)=>k);do{p.sort(()=>Math.random()-.5)}while(p.every((v,k)=>v===k));R.pool=p}}
function startLevel(i){S.hearts=Math.max(S.hearts,1);R={s:i,i:0,wrong:0,combo:0,miss:[]};initCh();go('brief')}

function brief(){const t=ST[R.s];return hud()+`<div class="card"><span class="tag">${t.era}</span><h2>${t.ic} ${t.name}</h2><p>${t.intro}</p></div>
<div class="card"><h3>📖 Pojok Baca</h3>${reader(R.s)}</div>
<div class="tip"><b>⚡ Cara berpikir historis</b><br>Untuk tiap peristiwa, tanyakan tiga hal: apa penyebabnya, siapa pelakunya, dan apa akibatnya bagi Nusantara. Bacaan di atas tetap bisa dibuka selama kamu mengerjakan tantangan.</div>
<p><button class="btn big" data-a="begin">Berangkat!</button><button class="btn ghost" data-a="hub">Kembali</button></p>`}

function play(){const t=ST[R.s],c=t.ch[R.i],n=t.ch.length;let body='';
if(c.k==='urut'){
body=R.done?`<ol class="ans">${R.pick.map((x,j)=>`<li><div class="chip ${x===j?'ok':'bad'}">${e(c.items[x])}</div></li>`).join('')}</ol>`:
`<p class="mut">Ketuk kotak sesuai urutan. Ketuk jawabanmu untuk mencabutnya.</p><ol class="ans">${R.pick.map((x,j)=>`<li><button class="chip sel" data-a="del" data-i="${j}">${e(c.items[x])}</button></li>`).join('')}</ol>${R.pool.filter(x=>!R.pick.includes(x)).map(x=>`<button class="chip" data-a="add" data-i="${x}">${e(c.items[x])}</button>`).join('')}`}
else if(c.k==='pilah'){body=c.items.map((it,j)=>{const p=R.pick[j];let c0='pill',c1='pill';
if(R.done){c0+=it[1]===0?' ok':p===0?' bad':'';c1+=it[1]===1?' ok':p===1?' bad':''}else{if(p===0)c0+=' sel';if(p===1)c1+=' sel'}
return `<div class="stmt"><p style="margin:.2em 0">${j+1}. ${e(it[0])}</p><div><button class="${c0}" data-a="cat" data-i="${j}" data-v="0" ${R.done?'disabled':''}>${e(c.cats[0])}</button><button class="${c1}" data-a="cat" data-i="${j}" data-v="1" ${R.done?'disabled':''}>${e(c.cats[1])}</button></div></div>`}).join('')}
else body=c.opts.map((o,k)=>{let cl='opt';if(R.done){if(k===c.a)cl+=' ok';else if(R.pick[0]===k)cl+=' bad'}return `<button class="${cl}" data-a="pick" data-i="${k}" ${R.done?'disabled':''}><b>${'ABCDE'[k]}</b><span>${e(o)}</span></button>`}).join('');
const ready=c.k==='mc'?true:c.k==='urut'?R.pick.length===c.items.length:R.pick.filter(x=>x===0||x===1).length===c.items.length;
let fb='';
if(R.done){const key=c.k==='urut'?`<ol class="ans">${c.items.map(x=>`<li>${e(x)}</li>`).join('')}</ol>`:c.k==='mc'?`<p style="margin:.3em 0">Kunci: <b>${'ABCDE'[c.a]}</b></p>`:'';
fb=`<div class="fb ${R.res?'ok':'bad'} pop"><b>${R.res?`✅ Tepat! +${R.gain} 🪙 +25 XP${R.combo>=3?` 🔥 Combo x${R.combo}`:''}`:'💥 Belum tepat, nyawa −1'}</b>${R.res&&c.k!=='urut'?'':key?`<div><b>Urutan/kunci yang benar:</b>${key}</div>`:''}
<p style="margin:.4em 0 0"><b>Pembahasan:</b> ${e(c.why)}</p><div class="more">📖 <b>Pengayaan:</b> ${e(ENR[R.s].more[R.i])}</div>
<div class="tip"><b>⚡ Tips Kilat · ${c.label}</b><ol>${T[c.k].map(x=>`<li>${x}</li>`).join('')}</ol></div></div>
<button class="btn big" data-a="next">${S.hearts<=0||R.wrong>=2?'Lanjut ➜':R.i<n-1?'Tantangan berikutnya ➜':'Selesai stasiun ➜'}</button>`}
return hud()+`<div class="bar"><i style="width:${(R.i+(R.done?1:0))/n*100}%"></i></div><p class="mut">${t.ic} ${t.name} · Tantangan ${R.i+1} dari ${n} · ${c.label}</p>
<details class="card"><summary>📖 Buka bacaan: ${t.name}</summary>${reader(R.s)}</details>
<div class="card">${c.src?`<div class="src">${c.img?`<img src="${c.img}" alt="" style="max-width:100%">`:''}${e(c.src)}</div>`:''}<h3>${e(c.q)}</h3>${body}
${R.done||c.k==='mc'?'':`<div><button class="btn" data-a="submit" ${ready?'':'disabled'}>Kunci Jawaban</button></div>`}</div>${fb}`}

function check(){const c=ST[R.s].ch[R.i];R.done=true;
R.res=c.k==='urut'?R.pick.every((v,j)=>v===j):c.k==='pilah'?c.items.every((it,j)=>R.pick[j]===it[1]):R.pick[0]===c.a;
if(R.res){R.combo++;R.gain=15+(R.combo>=3?5:0);S.coins+=R.gain;S.xp+=25}else{R.combo=0;R.wrong++;S.hearts--;R.miss.push(c.label)}
save();render()}

function next(){const n=ST[R.s].ch.length;if(S.hearts<=0){R.reason='hearts';return go('over')}
if(R.wrong>=2){R.reason='fail';return go('over')}
if(R.i<n-1){R.i++;initCh();return render()}
const stars=R.wrong===0?3:2;R.stars=stars;R.bonus=stars*15;S.coins+=R.bonus;
if(stars===3&&S.hearts<5){S.hearts++;R.heal=true}
S.stars[R.s]=Math.max(S.stars[R.s]||0,stars);save();go('done')}

function done(){const t=ST[R.s],last=R.s===4;return hud()+`<div class="card" style="text-align:center">${last?'<div class="big-emoji pop">🏆</div>':`<img class="emc pop" src="${IMG[R.s]}" alt="">`}<h2>${last?'Piagam Penjelajah Waktu':t.name+' selesai!'}</h2>
<div class="stars" style="font-size:2rem">${'⭐'.repeat(R.stars)}${'☆'.repeat(3-R.stars)}</div>
<p>Bonus <b>+${R.bonus}🪙</b>${R.heal?' · ❤️ +1 nyawa (nilai sempurna)':''}</p><p>Lencana: <b>${t.badge}</b></p><p class="mut">Pangkat: ${rank()} · ${S.xp} XP</p>
${last?'<p>Kamu berhasil merangkai rantai dari Renaissans sampai nasionalisme Indonesia. Bagikan satu kesimpulanmu kepada temanmu.</p>':''}</div>
${R.miss.length?`<div class="tip">Catatan: kamu terpeleset di tantangan <b>${R.miss.join(', ')}</b>. Ulangi stasiun ini kapan saja untuk mengejar bintang penuh.</div>`:''}
<p>${last?'':`<button class="btn big" data-a="start" data-i="${R.s+1}">Stasiun berikutnya ➜</button>`}<button class="btn ghost" data-a="hub">Peta</button></p>`}

function over(){const hp=R.reason==='hearts',r=REC[R.s],t=ST[R.s];
return `<div class="card" style="text-align:center"><div class="big-emoji pop">${hp?'💔':'🧭'}</div><h2>${hp?'Nyawa habis!':'Stasiun belum terlewati'}</h2>
<p>Kamu terpeleset di tantangan <b>${R.miss.join(', ')||'-'}</b> pada ${t.name}. Pelajari rekomendasi di bawah, lalu coba lagi dengan nyawa penuh.</p></div>
<div class="card rec"><h3>${t.ic} Yang perlu dibaca ulang</h3><b>📚 Materi</b><ul>${r.study.map(x=>`<li>${x}</li>`).join('')}</ul>
<b>⚡ Tiru langkah belajar ini</b><ol>${r.steps.map(x=>`<li>${x}</li>`).join('')}</ol>
<b>🧠 Strategi menjawab</b><ul>${[...new Set(R.miss)].map(m=>{const c=t.ch.find(x=>x.label===m);return `<li><b>${m}:</b> ${T[c.k][0]}</li>`}).join('')}</ul></div>
<p><button class="btn big" data-a="retry">Coba lagi (nyawa penuh)</button><button class="btn ghost" data-a="hub">Peta</button></p>`}

$('#app').addEventListener('click',ev=>{const b=ev.target.closest('[data-a]');if(!b)return;const a=b.dataset.a,i=+b.dataset.i;
const c=R&&ST[R.s]?ST[R.s].ch[R.i]:null;
if(a==='home'||a==='hub')go(a);
else if(a==='start'&&unlocked(i))startLevel(i);
else if(a==='begin')go('play');
else if(a==='retry'){S.hearts=5;save();startLevel(R.s)}
else if(a==='heal'&&S.coins>=40&&S.hearts<5){S.coins-=40;S.hearts++;save();render()}
else if(a==='reset'){if(confirm('Hapus semua progres dan mulai dari nol?')){S={coins:20,xp:0,hearts:5,stars:{}};R=null;save();render()}}
else if(a==='add'&&!R.done){R.pick.push(i);render()}
else if(a==='del'&&!R.done){R.pick.splice(i,1);render()}
else if(a==='cat'&&!R.done){R.pick=Array.from({length:c.items.length},(_,k)=>R.pick[k]==null?null:R.pick[k]);R.pick[i]=+b.dataset.v;render()}
else if(a==='pick'&&!R.done){R.pick=[i];check()}
else if(a==='submit'&&!R.done){const ok=c.k==='mc'?false:c.k==='urut'?R.pick.length===c.items.length:R.pick.filter(x=>x===0||x===1).length===c.items.length;if(ok)check()}
else if(a==='note'){N=i;render()}
else if(a==='vid'){const v=VIDEOS[b.dataset.k];if(v)b.outerHTML=`<div class="vidframe"><iframe src="https://www.youtube-nocookie.com/embed/${v.id}?autoplay=1&rel=0${v.t?'&start='+v.t:''}" title="Video ${v.label}" allow="accelerometer; autoplay; clipboard-write; encrypted-media; picture-in-picture" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe></div>`}
else if(a==='notes')go('notes');
else if(a==='next')next()});
render();
</script>
</body>
</html>
